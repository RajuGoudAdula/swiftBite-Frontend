<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Charset & Viewport -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-site-verification" content="_If3gFwjErb03w9Bc8iS7fAqjj-1Q24U9mz-t9kbPhM" />

    <!-- App Basic -->
    <title>SwiftBite – Order Food Smarter in Your College</title>
    <meta name="description" content="SwiftBite is a smart food ordering app for college students. Order in advance, pay online, and pick up your meal without waiting in line." />
    <meta name="theme-color" content="#000000" />
    <meta name="author" content="SwiftBite Team" />
    <meta name="keywords" content="SwiftBite, food app, college canteen, online food order, student food delivery, pickup orders" />

    <!-- Favicon & Icons -->
    <!-- Paste this inside the <head> of public/index.html -->
    <link rel="apple-touch-icon" sizes="57x57" href="/favicon/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/favicon/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/favicon/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/favicon/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/favicon/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/favicon/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/favicon/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/favicon/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-icon-180x180.png">

    <link rel="icon" type="image/png" sizes="192x192"  href="/favicon/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">

    <link rel="manifest" href="/favicon/manifest.json">

    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/favicon/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">


    <!-- Structured Data: Site Name for Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SwiftBite",
        "alternateName": "SwiftBite App",
        "url": "https://swiftbiteapp.netlify.app"
      }
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="SwiftBite" />
    <meta property="og:description" content="Skip the queue and order food from your college canteen with SwiftBite." />
    <meta property="og:image" content="%PUBLIC_URL%/preview-image.png" />
    <meta property="og:url" content="https://swiftbiteapp.netlify.app/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SwiftBite" />
    <meta name="twitter:description" content="Smart food ordering for college students. Order ahead. No waiting." />
    <meta name="twitter:image" content="%PUBLIC_URL%/preview-image.png" />

    <!-- Mobile & App Specific -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SwiftBite" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Fonts & Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run SwiftBite.</noscript>
    <div id="root"></div>
  </body>
</html>
